<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: el juego puede ocupar toda la pantalla (también bajo el notch);
         el motor lee las áreas seguras con #safe-probe y mantiene los controles dentro de ellas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14121a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="ROTONDA — aventura 2D de exploración, acertijos y surrealismo." />
    <title>ROTONDA</title>
    <!-- Icono vacío provisional: evita la petición (404) a /favicon.ico hasta tener icono definitivo. -->
    <link rel="icon" href="data:," />
    <!-- Al instalarlo como app (Android), el manifiesto fija la orientación horizontal. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="ROTONDA"></canvas>

    <!-- Pantalla de orientación: solo HTML/CSS, se muestra con el dispositivo en vertical
         (media query orientation: portrait), incluso si el JavaScript no llegara a cargar. -->
    <div id="rotate" role="status" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p class="rotate-title">Gira tu dispositivo</p>
        <p class="rotate-text rotate-touch">ROTONDA se juega en horizontal.</p>
        <p class="rotate-text rotate-desktop">ROTONDA se juega en horizontal. Ensancha la ventana del navegador.</p>
      </div>
    </div>

    <div id="safe-probe" aria-hidden="true"></div>
    <pre id="fatal" hidden></pre>
    <noscript>ROTONDA necesita JavaScript activado para funcionar.</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
